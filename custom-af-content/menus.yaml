# Menu principal de reso.co (vue membre), utilisé par l'aperçu pour l'en-tête bureau et mobile.
#
# Ce fichier décrit le menu à configurer dans le back-office AlumnForce (gestion du menu) :
# il ne se colle pas dans le site. Point de départ : le menu actuel du site,
# capturé dans preview/site/production/menus.yaml (même format) — comparer les deux pour voir les changements.
#
# Chaque entrée :
#   titre:      texte affiché
#   lien:       chemin d'une page du site (/page/…) ou URL complète (https://…)
#               — une URL complète correspond à une entrée « lien externe » d'AlumnForce,
#                 dont le balisage est un peu différent (l'aperçu le reproduit)
#   sous-menu:  (facultatif) liste d'entrées ; trois niveaux au plus en comptant le menu
#
# Pour cibler une entrée dans custom.css, utiliser son lien, identique dans l'aperçu et sur le site
# (les identifiants AlumnForce, eux, ne sont connus qu'une fois l'entrée créée) :
#   #header ul.nav > li > a[href="/page/comment-etre-ensemble-dans-reso"]
#
# ---------------------------------------------------------------------------------------------
# Proposition 2026 (document « Page d'accueil + menu interne Reso - Proposition 2026 ») :
# 5 catégories, sans Accueil (le logo y mène) ni Aide (à mettre dans le pied de page), avec les remarques de Benjamin Couchot (« Être ensemble » au lieu de
# « Communauté », « Les groupes locaux », « Les groupes en ligne », « La voie des gardiennes et
# des gardiens du cœur », Méditons ensemble aussi dans Être ensemble).
#
# Les 5 catégories sont colorées par custom.css (section « MENU PRINCIPAL : 5 CATÉGORIES »),
# qui les reconnaît à leur LIEN : en les créant dans AlumnForce, garder exactement ces liens.
#   Être ensemble            /page/comment-etre-ensemble-dans-reso
#   Événements & actualité   /agenda
#   Enseignements & replays  /page/ressources
#   Pratique au quotidien    /articles/categories/289%2C292%2C297%2C293%2C298%2C295%2C296%2C294
#   Votre chemin dans Reso   /page/votre-chemin-dans-reso
# ---------------------------------------------------------------------------------------------

