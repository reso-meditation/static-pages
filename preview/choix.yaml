# Choix à trancher (réunion de communication interne), proposés dans la visionneuse (panneau « Choix »).
# Ils s'appliquent aux versions « Proposition » et « Brouillon », pas à « Production ».
#
# Chaque choix :
#   id:        identifiant (dans l'adresse de la visionneuse)
#   groupe:    (facultatif) titre de groupe affiché au-dessus de la question dans le panneau
#   question:  intitulé affiché
#   options:   les réponses possibles ; la PREMIÈRE est celle de custom-af-content/ (par défaut)
#     - id, titre, detail (facultatif)
#       couleurs:  (facultatif) pastilles affichées à côté du titre
#       css:       (facultatif) fichier de preview/choix/, ajouté juste après custom.css
#       menus:     (facultatif) modifications du menu (custom-af-content/menus.yaml) :
#                    remplacer: { "Catégorie": [ entrées du sous-menu, au format de menus.yaml ] }
#                    renommer:  { "Catégorie > Entrée": "Nouveau titre" }
#                    retirer:   [ "Catégorie > Entrée" ]
#                  Une entrée est désignée par les titres de ses parents et le sien, séparés par « > ».
#       accueil:   (facultatif) modifications de l'accueil (custom-af-content/accueil.yaml) :
#                    retirer:   [ réf ]                         réf : nom du widget (slider…) ou fichier html
#                    remplacer: { réf: "preview/choix/….html" }  autre contenu d'un widget « html libre »
#                    ajouter:   [ { html: "preview/choix/….html", titre, avant: réf | apres: réf } ]
#   Un chemin ou une réf qui commence par « ? » est facultatif (pas d'avertissement s'il n'existe pas).
#   Les CSS s'empilent, et les modifications s'appliquent, dans l'ordre des questions de ce fichier.
#
# Une réponse retenue s'intègre ensuite à custom-af-content/ (custom.css, menus.yaml, accueil.yaml,
# widgets html) : en production, seul ce dossier compte.

- id: palette
