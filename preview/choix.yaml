# Choix à trancher (réunion de communication interne), proposés dans la visionneuse (panneau « Choix »).
# Ils ne s'appliquent qu'à la version « Proposition » (custom-af-content/), pas à « Production ».
#
# Chaque choix :
#   id:        identifiant (dans l'adresse de la visionneuse)
#   question:  intitulé affiché
#   options:   les réponses possibles ; la PREMIÈRE est celle de custom-af-content/ (par défaut)
#     - id, titre, detail (facultatif)
#       couleurs:  (facultatif) pastilles affichées à côté du titre
#       css:       (facultatif) fichier de preview/choix/, ajouté juste après custom.css
#       menus:     (facultatif) modifications du menu (custom-af-content/menus.yaml) :
#                    remplacer: { "Catégorie": [ entrées du sous-menu, au format de menus.yaml ] }
#                    renommer:  { "Catégorie > Entrée": "Nouveau titre" }
#                    retirer:   [ "Catégorie > Entrée" ]
#                  Une entrée est désignée par les titres de ses parents et le sien, séparés par « > ».
#                  Un chemin qui commence par « ? » est facultatif (pas d'avertissement s'il n'existe pas).
#                  Les modifications s'appliquent dans l'ordre des questions de ce fichier.
#
# Une réponse retenue s'intègre ensuite à custom-af-content/ (custom.css, menus.yaml) :
# en production, seul ce dossier compte.

- id: palette
  question: Couleurs des catégories
  options:
    - id: maquette
      titre: Maquette de l'accueil
      detail: Magenta de la charte (déjà dans custom.css), vert et bleu de la maquette, orange et gris de la palette 1.
      couleurs: ["#9F1557", "#597E4A", "#004D84", "#FF9A0C", "#E1DFDF"]
    - id: palette-1
      titre: Palette 1 du document
      couleurs: ["#AA4891", "#597E4A", "#4F6197", "#FF9A0C", "#E1DFDF"]
      css: palette-1.css
    - id: charte
      titre: Palette 2 du document (« charte Reso »)
      couleurs: ["#982179", "#005B31", "#004D84", "#FFD400", "#6923A5"]
      css: palette-charte.css
    - id: palette-3
      titre: Palette 3 du document
      couleurs: ["#551800", "#D70900", "#004680", "#FFD400", "#EBE4E0"]
      css: palette-3.css

- id: lisere
  question: Liseré coloré à gauche des cartes
  options:
    - id: oui
      titre: Avec liseré
    - id: non
      titre: Sans liseré
      css: sans-lisere.css

- id: sous-menus
  question: Style des sous-menus
  options:
    - id: alumnforce
      titre: Style AlumnForce actuel
      detail: Fond gris, entrée survolée en jaune vif.
    - id: cartes
      titre: Cartes blanches arrondies
      detail: Ombre douce, entrée survolée en jaune clair.
      css: sous-menus-cartes.css
    - id: pastel
      titre: Cartes arrondies, fond pastel de la catégorie
      detail: Même teinte que la bande de la section sur l'accueil (bureau et mobile).
      css: sous-menus-pastel.css

- id: pratique
  question: Sous-menu « Pratique au quotidien »
  options:
    - id: liste
      titre: Une seule liste
      detail: Minuteur, les 7 catégories de méditation, Méditons ensemble.
    - id: seul-ensemble
      titre: Deux groupes, « Pratiquer seul » et « Pratiquer ensemble »
      detail: Comme le document, avec un 3e niveau de menu.
      menus:
        remplacer:
          "Pratique au quotidien":
            - titre: Pratiquer seul au quotidien
              lien: /articles/categories/289%2C292%2C297%2C293%2C298%2C295%2C296%2C294
              sous-menu:
                - titre: Méditations du quotidien
                  lien: /articles/categories/292
                - titre: Pratiques de bienveillance
                  lien: /articles/categories/294
                - titre: Méditations sur le corps
                  lien: /articles/categories/293
                - titre: Méditations sur les émotions
                  lien: /articles/categories/296
                - titre: Méditations sur la confiance
                  lien: /articles/categories/295
                - titre: Méditations sur l'esprit
                  lien: /articles/categories/297
                - titre: Méditations spécifiques
                  lien: /articles/categories/298
                - titre: Timer
                  lien: https://www.reso.co/page/minuteur
            - titre: Pratiquer ensemble au quotidien
              lien: /page/activites-groupes
              sous-menu:
                - titre: Méditons ensemble
                  lien: /page/activites-groupes

- id: meditons
  question: Où mettre « Méditons ensemble » ?
  options:
    - id: les-deux
      titre: Être ensemble et Pratique au quotidien
    - id: pratique
      titre: Seulement Pratique au quotidien
      detail: Document et Rebecca.
      menus:
        retirer: ["Être ensemble > Méditons ensemble"]
    - id: etre-ensemble
      titre: Seulement Être ensemble
      detail: Proposition de Benjamin Couchot.
      menus:
        # selon la structure de Pratique au quotidien retenue plus haut
        retirer: ["?Pratique au quotidien > Méditons ensemble", "?Pratique au quotidien > Pratiquer ensemble au quotidien"]

- id: nom-chemin
  question: Nom de la 5e catégorie
  options:
    - id: votre-chemin
      titre: Votre chemin dans Reso
    - id: se-reperer
      titre: Se repérer dans Reso
      detail: Proposition de Rebecca.
      menus:
        renommer: { "Votre chemin dans Reso": "Se repérer dans Reso" }

- id: polices
  question: Polices du site
  options:
    - id: actuelles
      titre: Actuelles (polices du système)
      detail: L'@import de Inter et Libre Baskerville est mal placé dans custom.css, donc ignoré.
    - id: corrigees
      titre: Inter et Libre Baskerville, comme prévu
      detail: Touche tout le site, pas seulement l'accueil.
      css: polices-corrigees.css
