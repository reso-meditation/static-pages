<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pages Reso</title>
  <link rel="icon" href="data:,">
  <!-- CodeMirror (éditeur des fichiers) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.css">
  <link rel="stylesheet" href="preview/viewer.css?r=8">
</head>
<body>
  <aside id="editor" class="editor" aria-label="Éditer les fichiers" hidden>
    <div class="editor-head">
      <strong>Éditer</strong>
      <span id="editor-status" class="hint"></span>
      <button type="button" id="editor-close" class="link-btn">Fermer</button>
    </div>
    <div id="editor-tabs" class="editor-tabs" role="tablist" aria-label="Fichiers de custom-af-content/"></div>
    <div id="editor-warn" class="editor-warn" hidden></div>
    <div id="editor-cm" class="editor-cm"></div>
    <div class="editor-actions">
      <button type="button" id="ed-copy" class="btn">Copier</button>
      <button type="button" id="ed-diff" class="btn">Différences</button>
      <button type="button" id="ed-revert" class="btn">Rétablir</button>
      <button type="button" id="ed-new" class="btn">Nouveau fichier</button>
      <button type="button" id="ed-discard" class="link-btn" title="Rétablir tous les fichiers modifiés tels qu'ils sont dans le dépôt">Tout rétablir</button>
    </div>
  </aside>
  <div id="editor-resizer" class="editor-resizer" role="separator" aria-orientation="vertical" title="Glisser pour redimensionner" hidden></div>

  <section class="workspace">
    <!-- Barre principale : la version affichée, comment la modifier, l'enregistrer, la partager -->
    <div class="toolbar">
      <div class="version-bar" role="group" aria-label="Version">
        <strong class="brand">Pages Reso</strong>
        <label for="version-select" class="version-label">Version</label>
        <select id="version-select" class="page-select" title="Version affichée : Production et Proposition (lecture seule), ou une de vos versions"></select>
        <span class="tool-group" role="group" aria-label="Modifier la version">
          <button type="button" id="toggle-editor" class="btn" aria-pressed="false" aria-controls="editor">✎ Éditer</button>
          <button type="button" id="toggle-panel" class="btn" aria-pressed="true" aria-controls="panel" title="Choix à trancher : chaque réponse modifie les fichiers de la version">⚙ Choix</button>
        </span>
        <span class="tool-group" role="group" aria-label="Enregistrer la version">
          <button type="button" id="version-save" class="btn primary">Enregistrer</button>
          <button type="button" id="version-saveas" class="btn" title="Enregistrer ce qui est affiché dans une nouvelle version">Enregistrer sous…</button>
          <button type="button" id="version-discard" class="btn" title="Abandonner le brouillon : revenir à la version enregistrée">Annuler les modifications</button>
          <button type="button" id="version-more" class="btn" title="Mes versions : ouvrir, renommer, supprimer">Mes versions</button>
          <details id="share" class="menu-btn">
            <summary class="btn" title="Partager la version affichée, brouillon compris">Partager ▾</summary>
            <div class="menu">
              <button type="button" id="copy-link" title="Lien qui contient toute la version affichée : choix et fichiers modifiés">Copier le lien de partage</button>
              <button type="button" id="copy-summary" title="Liste des choix et lien de partage, à coller dans un compte rendu">Copier le résumé</button>
            </div>
          </details>
        </span>
      </div>
    </div>
    <!-- État de la version (jaune : brouillon non enregistré) -->
    <div id="draft-bar" class="draft-bar"><span id="draft-text" role="status"></span></div>
    <!-- Affichage : ce qu'on regarde, sans rien modifier -->
    <div class="view-bar" role="group" aria-label="Affichage">
      <label for="page-select" class="view-label">Page</label>
      <select id="page-select" class="page-select small"></select>
      <span id="page-type" class="tag"></span>
      <div class="segmented" role="group" aria-label="Largeur d'écran" id="widths">
        <button type="button" data-w="1366">Bureau</button>
        <button type="button" data-w="1024">Portable</button>
        <button type="button" data-w="768">Tablette</button>
        <button type="button" data-w="390">Mobile</button>
      </div>
      <a id="open-live" class="link-btn view-live" target="_blank" rel="noopener">Voir sur reso.co ↗</a>
    </div>
    <div id="warnings" class="warnings" hidden></div>
    <div id="stage" class="stage"></div>
  </section>

  <aside id="panel" class="panel" aria-label="Choix">
    <div class="panel-head">
      <strong>Choix</strong>
      <span id="panel-hint" class="hint"></span>
    </div>
    <div id="choices" class="choices"></div>
    <div class="panel-actions">
      <button type="button" id="reset" class="link-btn" title="Défaire tous les choix (leurs modifications sont retirées des fichiers)">Choix par défaut</button>
    </div>
  </aside>

  <dialog id="diff-dialog" class="diff-dialog">
    <header>
      <strong id="diff-title"></strong>
      <button type="button" id="diff-copy" class="btn">Copier les différences</button>
      <button type="button" id="diff-close" class="btn">Fermer</button>
    </header>
    <div id="diff-body" class="diff-body"></div>
  </dialog>

  <dialog id="ask-dialog" class="ask-dialog">
    <form id="ask-form" method="dialog">
      <strong id="ask-title"></strong>
      <p id="ask-text"></p>
      <input id="ask-input" type="text" autocomplete="off" spellcheck="false" aria-labelledby="ask-text">
      <div id="ask-buttons" class="ask-buttons"></div>
    </form>
  </dialog>

  <dialog id="versions-dialog" class="versions-dialog">
    <header>
      <strong>Mes versions</strong>
      <button type="button" id="versions-saveas" class="btn">Enregistrer sous…</button>
      <button type="button" id="versions-close" class="btn">Fermer</button>
    </header>
    <p class="hint">Gardées dans ce navigateur seulement (pas dans le dépôt). Pour en donner une à quelqu'un : ouvrez-la, puis « Copier le lien de partage » dans le panneau Choix.</p>
    <p id="versions-empty" class="versions-empty">Aucune version : modifiez la Proposition, puis « Enregistrer sous… ».</p>
    <ul id="versions-list" class="versions-list"></ul>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/yaml/yaml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/search.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/jump-to-line.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
  <script src="preview/choix-fichiers.js?r=8"></script>
  <script src="preview/versions.js?r=8"></script>
  <script src="preview/editor.js?r=8"></script>
  <script src="preview/viewer.js?r=8"></script>
</body>
</html>
