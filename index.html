<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pages Reso</title>
  <link rel="icon" href="data:,">
  <!-- CodeMirror (éditeur du brouillon) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.css">
  <link rel="stylesheet" href="preview/viewer.css">
</head>
<body>
  <aside id="editor" class="editor" aria-label="Éditer le brouillon" hidden>
    <div class="editor-head">
      <strong>Éditer</strong>
      <span id="editor-status" class="hint"></span>
      <button type="button" id="editor-close" class="link-btn">Fermer</button>
    </div>
    <div id="editor-tabs" class="editor-tabs" role="tablist" aria-label="Fichiers de custom-af-content/"></div>
    <div id="editor-warn" class="editor-warn" hidden></div>
    <div id="editor-cm" class="editor-cm"></div>
    <div class="editor-actions">
      <button type="button" id="ed-copy" class="btn">Copier</button>
      <button type="button" id="ed-diff" class="btn">Différences</button>
      <button type="button" id="ed-revert" class="btn">Rétablir</button>
      <button type="button" id="ed-new" class="btn">Nouveau fichier</button>
      <button type="button" id="ed-discard" class="link-btn">Abandonner le brouillon</button>
    </div>
  </aside>
  <div id="editor-resizer" class="editor-resizer" role="separator" aria-orientation="vertical" title="Glisser pour redimensionner" hidden></div>

  <section class="workspace">
    <div class="toolbar">
      <div class="title">
        <strong class="brand">Pages Reso</strong>
        <select id="page-select" class="page-select" aria-label="Page affichée"></select>
        <span id="page-type" class="tag"></span>
      </div>
      <div class="controls">
        <div class="segmented" role="group" aria-label="Largeur d'écran" id="widths">
          <button type="button" data-w="1366">Bureau</button>
          <button type="button" data-w="1024">Portable</button>
          <button type="button" data-w="768">Tablette</button>
          <button type="button" data-w="390">Mobile</button>
        </div>
        <button type="button" id="compare" class="btn" aria-pressed="false" title="Deux réglages côte à côte (touche C)">◧ Comparer</button>
        <button type="button" id="swap" class="btn" title="Échanger les réglages A et B (touche B)">⇄ Basculer</button>
        <button type="button" id="toggle-editor" class="btn" aria-pressed="false" aria-controls="editor" title="Modifier les fichiers de custom-af-content/ dans un brouillon">✎ Éditer</button>
        <button type="button" id="toggle-panel" class="btn" aria-pressed="true" aria-controls="panel">⚙ Choix</button>
        <a id="open-live" class="btn" target="_blank" rel="noopener">Voir sur reso.co</a>
      </div>
    </div>
    <div id="warnings" class="warnings" hidden></div>
    <div id="stage" class="stage"></div>
  </section>

  <aside id="panel" class="panel" aria-label="Choix">
    <div class="panel-head">
      <strong>Choix</strong>
      <span id="panel-hint" class="hint"></span>
    </div>
    <div id="choices" class="choices"></div>
    <div class="panel-actions">
      <button type="button" id="copy-summary" class="btn">Copier le résumé</button>
      <button type="button" id="copy-link" class="btn">Copier le lien</button>
      <button type="button" id="reset" class="link-btn">Réinitialiser</button>
    </div>
    <div class="panel-section">
      <h2>À coller dans AlumnForce</h2>
      <p class="hint">Contenu de la Proposition (custom-af-content/), sans les choix ci-dessus.</p>
      <div id="copy-buttons" class="copy-list"></div>
    </div>
  </aside>

  <dialog id="diff-dialog" class="diff-dialog">
    <header>
      <strong id="diff-title"></strong>
      <button type="button" id="diff-copy" class="btn">Copier les différences</button>
      <button type="button" id="diff-close" class="btn">Fermer</button>
    </header>
    <div id="diff-body" class="diff-body"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/yaml/yaml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/search.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/jump-to-line.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
  <script src="preview/editor.js"></script>
  <script src="preview/viewer.js"></script>
</body>
</html>
